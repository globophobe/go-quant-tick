[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "asyncio-quant-tick"
version = "0.1.7"
description = "Asyncio Quant Tick aggregates candlesticks from high frequency tick data from WebSockets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex", email = "globophobe@gmail.com" }]
keywords = ["quant", "trading", "trading-strategies", "coinbase", "bitfinex", "bitmex", "bybit"]
classifiers = ["Development Status :: 4 - Beta", "Operating System :: OS Independent"]
dependencies = [
    "python-dotenv>=1.1.1",
    "websockets>=15,<16",
]

[project.optional-dependencies]
gcp = ["google-cloud-pubsub>=2.33.0"]

[project.urls]
Homepage = "https://github.com/globophobe/asyncio-quant-tick"
Repository = "https://github.com/globophobe/asyncio-quant-tick"

[tool.hatch.build.targets.wheel]
packages = ["quant_tick"]

[dependency-groups]
deploy = ["sentry-sdk>=2.39.0"]
dev = [
    "invoke>=2.2.1",
    "ruff>=0.15.2",
]

[tool.uv]
exclude-newer = "P7D"
